name: Zeilen zählen

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zaehlen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 zaehlen.py
        env:
          LOC_TOKEN: ${{ secrets.LOC_TOKEN }}
          LOC_EXCLUDE: ${{ secrets.LOC_EXCLUDE }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || { git commit -qam "Zeilen aktualisiert" && git push -q; }
